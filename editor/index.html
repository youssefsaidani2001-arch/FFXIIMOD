<title>Battlepack Workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Code+Pro:wght@400;600&display=swap">
<style>
/* Layout: three-pane workbench (sections | rows | record form) under a compact tool bar; the record form is the work surface. */
:root {
  --bg: #f2f4f7; --panel: #ffffff; --fg: #1b2330; --muted: #5d6b7c; --line: #d6dce4;
  --accent: #1f7a8c; --accent-fg: #ffffff; --changed: #b8730f; --changed-bg: #fff3dd; --danger: #a63d40;
  --font-display: 'Cinzel', 'Times New Roman', serif; --font-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; --font-mono: 'Source Code Pro', Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #13171c; --panel: #1b2027; --fg: #e5eaf0; --muted: #98a4b3; --line: #2c343e; --accent: #5cc4d4; --accent-fg: #0f1418; --changed: #e0a24a; --changed-bg: #3a2e14; --danger: #e07a7c; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #13171c; --panel: #1b2027; --fg: #e5eaf0; --muted: #98a4b3; --line: #2c343e; --accent: #5cc4d4; --accent-fg: #0f1418; --changed: #e0a24a; --changed-bg: #3a2e14; --danger: #e07a7c; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.4; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=text], input[type=number], input[type=search], select { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; }
.app { display: flex; flex-direction: column; height: 100%; padding-inline: 16px; padding-block: 8px; gap: 8px; }
header.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
header h1 { font-family: var(--font-display); font-size: 18px; margin: 0; letter-spacing: .04em; text-wrap: balance; }
header .file { color: var(--muted); font-family: var(--font-mono); font-size: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
main.wb { display: grid; grid-template-columns: 230px 260px minmax(0, 1fr); gap: 10px; flex: 1; min-height: 0; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.pane h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.pane h2 input { margin-left: auto; width: 46%; font-size: 12px; }
.list { overflow: auto; flex: 1; margin: 0; padding: 4px; list-style: none; }
.list li { padding: 4px 8px; border-radius: 4px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.list li:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.list li.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.list li .idx { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 3.2em; font-variant-numeric: tabular-nums; }
.list li .meta { margin-left: auto; font-size: 11px; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
.list li.missing { opacity: .45; }
.list li.touched .idx::after { content: '●'; color: var(--changed); margin-left: 4px; }
.detail { overflow: auto; padding: 10px 12px; flex: 1; }
.detail .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; margin-bottom: 8px; }
.detail .head strong { font-size: 16px; }
.detail .head .mono { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px 14px; }
.field { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px; align-items: center; padding: 3px 6px; border-radius: 4px; }
.field.changed { background: var(--changed-bg); }
.field label { display: flex; flex-direction: column; min-width: 0; }
.field label .n { font-weight: 600; overflow-wrap: anywhere; }
.field label .t { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.field .ctl { display: flex; gap: 4px; }
.field .ctl select { flex: 1; min-width: 0; }
.field .ctl input[type=number], .field .ctl input[type=text] { width: 100%; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.field .ctl input.short { width: 64px; flex: none; }
fieldset.grp { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px 8px; margin: 4px 0 0; }
fieldset.grp legend { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding: 0 6px; }
fieldset.grp .fields { margin-top: 2px; }
.hex { margin-top: 14px; }
.hex summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.hexgrid { display: grid; grid-template-columns: repeat(16, minmax(34px, 1fr)); gap: 3px; margin-top: 8px; max-width: 760px; }
.hexgrid input { width: 100%; font-family: var(--font-mono); text-align: center; padding: 2px; text-transform: uppercase; }
.hexgrid input.changed { background: var(--changed-bg); border-color: var(--changed); }
.hexgrid .o { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.changes { border-top: 1px solid var(--line); padding-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; }
.changes .count { font-family: var(--font-mono); }
.changes .count b { color: var(--changed); }
#changeList { width: 100%; max-height: 120px; overflow: auto; margin: 0; padding: 0; list-style: none; font-family: var(--font-mono); font-size: 12px; display: none; }
#changeList.open { display: block; }
#changeList li { padding: 2px 4px; cursor: pointer; }
#changeList li:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.empty { padding: 24px; color: var(--muted); max-width: 62ch; }
.empty h3 { color: var(--fg); margin: 0 0 6px; }
.empty code { font-family: var(--font-mono); font-size: 12px; }
.empty ol { padding-left: 20px; }
.toast { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.show { opacity: 1; }
.drop { outline: 3px dashed var(--accent); outline-offset: -6px; }
@media (max-width: 900px) {
  main.wb { grid-template-columns: 1fr; grid-auto-rows: minmax(160px, auto); }
  .pane { max-height: 40vh; }
  .pane.detailPane { max-height: none; }
  .field { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="app">
  <header class="bar">
    <h1>Battlepack Workbench</h1>
    <span class="file" id="fileName">no file loaded</span>
    <div class="tools">
      <input type="file" id="openBin" accept=".bin,application/octet-stream" hidden>
      <input type="file" id="openJson" accept=".json,application/json" hidden>
      <button id="btnOpen" class="primary" title="Open battle_pack.bin extracted with VBF Browser">Open battle_pack.bin</button>
      <button id="btnOpenSection" title="Open a single section exported by the Insurgent's Toolkit">Open section</button>
      <select id="sectionPick" title="Section id of the opened blob" hidden></select>
      <button id="btnLoadChanges" title="Re-apply a changes.json saved earlier">Load changes</button>
      <button id="btnSample" title="Loads a small synthetic file so you can try the editor">Sample data</button>
    </div>
  </header>

  <main class="wb">
    <aside class="pane">
      <h2>Sections <input type="search" id="secFilter" placeholder="filter" aria-label="filter sections"></h2>
      <ul class="list" id="secList"></ul>
    </aside>
    <section class="pane">
      <h2>Rows <input type="search" id="rowFilter" placeholder="name or #index" aria-label="filter rows"></h2>
      <ul class="list" id="rowList"></ul>
    </section>
    <section class="pane detailPane">
      <h2>Record <span id="recordMeta" style="margin-left:auto;font-family:var(--font-mono);text-transform:none;letter-spacing:0"></span></h2>
      <div class="detail" id="detail"></div>
    </section>
  </main>

  <footer class="changes">
    <span class="count" id="changeCount"><b>0</b> changed rows</span>
    <button id="btnToggleChanges">Show list</button>
    <button id="btnRevertRow">Revert this row</button>
    <span style="flex:1"></span>
    <button id="btnCopyLua" title="Copies a Lua Loader script that patches the live battlepack">Copy Lua patch</button>
    <button id="btnSaveJson">Save changes.json</button>
    <button id="btnSaveLua">Save Lua patch</button>
    <button id="btnSaveBin" class="primary">Save battle_pack.bin</button>
    <button id="btnSaveZip">Save all (.zip)</button>
    <ul id="changeList"></ul>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>/* Battlepack Workbench core: pure data logic, no DOM. Shared by the page and the Node tests. */
(function (root) {
  const LE = true;
  const RAW_ONLY = new Set([10, 39]);           // bespoke layouts (Insurgent's Toolkit export special-cases)
  const TYPE_SIZE = { u8: 1, s8: 1, u16: 2, s16: 2, u32: 4, s32: 4, u64: 8, s64: 8, f32: 4, f64: 8, bf8: 1, bf16: 2, bf32: 4, bf64: 8 };

  function readNum(dv, off, type) {
    switch (type) {
      case 'u8': return dv.getUint8(off);
      case 's8': return dv.getInt8(off);
      case 'u16': case 'bf16': return dv.getUint16(off, LE);
      case 's16': return dv.getInt16(off, LE);
      case 'u32': case 'bf32': return dv.getUint32(off, LE);
      case 's32': return dv.getInt32(off, LE);
      case 'u64': case 'bf64': return dv.getBigUint64(off, LE);
      case 's64': return dv.getBigInt64(off, LE);
      case 'f32': return dv.getFloat32(off, LE);
      case 'f64': return dv.getFloat64(off, LE);
      case 'bf8': return dv.getUint8(off);
    }
    throw new Error('type ' + type);
  }
  function writeNum(dv, off, type, v) {
    switch (type) {
      case 'u8': case 'bf8': return dv.setUint8(off, Number(v) & 0xFF);
      case 's8': return dv.setInt8(off, Number(v));
      case 'u16': case 'bf16': return dv.setUint16(off, Number(v) & 0xFFFF, LE);
      case 's16': return dv.setInt16(off, Number(v), LE);
      case 'u32': case 'bf32': return dv.setUint32(off, Number(v) >>> 0, LE);
      case 's32': return dv.setInt32(off, Number(v), LE);
      case 'u64': case 'bf64': return dv.setBigUint64(off, BigInt.asUintN(64, BigInt(v)), LE);
      case 's64': return dv.setBigInt64(off, BigInt.asIntN(64, BigInt(v)), LE);
      case 'f32': return dv.setFloat32(off, Number(v), LE);
      case 'f64': return dv.setFloat64(off, Number(v), LE);
    }
    throw new Error('type ' + type);
  }

  class Battlepack {
    /** @param {ArrayBuffer} buf  @param {object} schema  */
    constructor(buf, schema, opts) {
      this.buf = buf;
      this.orig = new Uint8Array(buf.slice(0));
      this.u8 = new Uint8Array(buf);
      this.dv = new DataView(buf);
      this.schema = schema || {};
      this.sections = [];
      this.touched = new Map(); // "sec:row" -> true
      this.mode = 'file';
      this.parse(opts || {});
    }

    parse(opts) {
      const size = this.buf.byteLength;
      const magic0 = this.text(0, 4);
      if (magic0 === 'st2e' || opts.singleSection != null) {
        // a single exported section blob
        const id = opts.singleSection == null ? -1 : opts.singleSection;
        this.mode = 'section';
        this.sections = [this.parseSection(id, 0, size)];
        return;
      }
      const count = this.dv.getUint32(0, LE);
      if (count === 0 || count > 256 || 4 + count * 4 > size) throw new Error('Not a battlepack: bad section count ' + count);
      const offs = [];
      for (let i = 0; i < count; i++) offs.push(this.dv.getUint32(4 + i * 4, LE));
      // offsets may be absolute in-memory pointers (dumped from RAM): rebase if the first one is out of range
      let base = 0;
      const firstValid = offs.find(o => o !== 0);
      if (firstValid !== undefined && firstValid >= size) base = firstValid - (4 + count * 4);
      const sorted = offs.map((o, i) => ({ o: o ? o - base : 0, i })).filter(x => x.o > 0).sort((a, b) => a.o - b.o);
      const ends = new Map();
      for (let k = 0; k < sorted.length; k++) ends.set(sorted[k].i, k + 1 < sorted.length ? sorted[k + 1].o : size);
      for (let i = 0; i < count; i++) {
        const start = offs[i] ? offs[i] - base : 0;
        if (!start || start >= size) { this.sections.push({ id: i, missing: true, count: 0, entrySize: 0 }); continue; }
        this.sections.push(this.parseSection(i, start, ends.get(i)));
      }
    }

    text(off, n) { let s = ''; for (let i = 0; i < n && off + i < this.u8.length; i++) s += String.fromCharCode(this.u8[off + i]); return s; }

    parseSection(id, start, end) {
      const sec = { id, start, end, length: end - start, raw: RAW_ONLY.has(id), missing: false };
      const magic = this.text(start, 4);
      if (id === 0 && magic !== 'st2e') {
        // Section 0: itemSize u16 @0, count u16 @2, entries from +4
        sec.kind = 'sec0';
        sec.entrySize = this.dv.getUint16(start, LE);
        sec.count = this.dv.getUint16(start + 2, LE);
        sec.list = start + 4;
      } else if (magic === 'st2e') {
        sec.kind = 'st2e';
        sec.count = this.dv.getUint32(start + 4, LE);
        sec.entrySize = this.dv.getUint16(start + 8, LE);
        const ptr = this.dv.getUint32(start + 0xC, LE);
        const need = sec.count * sec.entrySize;
        if (ptr >= start && ptr + need <= end) sec.list = ptr;                 // absolute file offset
        else if (start + ptr + need <= end && ptr >= 0x10) sec.list = start + ptr; // relative to section
        else sec.list = start + 0x20;                                            // default header size
        sec.textOffset = this.dv.getUint32(start + 0x14, LE);
      } else {
        sec.kind = 'blob'; sec.raw = true; sec.count = 1; sec.entrySize = sec.length; sec.list = start;
      }
      if (sec.list + sec.count * sec.entrySize > end) { sec.warning = 'entries exceed section bounds'; sec.count = Math.max(0, Math.floor((end - sec.list) / (sec.entrySize || 1))); }
      sec.fields = (this.schema[id] && this.schema[id].fields) || [];
      if (!sec.fields.length) sec.raw = true;
      return sec;
    }

    rowAddr(sec, row) { return sec.list + row * sec.entrySize; }

    /** value of a schema field for a row (bitfield children resolved) */
    get(sec, row, field) {
      const addr = this.rowAddr(sec, row) + field.offset;
      if (field.parent && field.bitStart != null) {
        const parent = sec.fields.find(f => f.name === field.parent && f.bitfield);
        const raw = readNum(this.dv, this.rowAddr(sec, row) + parent.offset, parent.type);
        if (typeof raw === 'bigint') return Number((raw >> BigInt(field.bitStart)) & ((1n << BigInt(field.bitLength)) - 1n));
        return (raw >>> field.bitStart) & ((1 << field.bitLength) - 1) >>> 0;
      }
      return readNum(this.dv, addr, field.type);
    }

    set(sec, row, field, value) {
      const base = this.rowAddr(sec, row);
      if (field.parent && field.bitStart != null) {
        const parent = sec.fields.find(f => f.name === field.parent && f.bitfield);
        const off = base + parent.offset;
        if (parent.type === 'bf64') {
          const mask = ((1n << BigInt(field.bitLength)) - 1n) << BigInt(field.bitStart);
          let raw = readNum(this.dv, off, 'bf64');
          raw = (raw & ~mask) | ((BigInt(value) << BigInt(field.bitStart)) & mask);
          writeNum(this.dv, off, 'bf64', raw);
        } else {
          const mask = (((1 << field.bitLength) - 1) << field.bitStart) >>> 0;
          let raw = readNum(this.dv, off, parent.type) >>> 0;
          raw = ((raw & ~mask) | ((Number(value) << field.bitStart) & mask)) >>> 0;
          writeNum(this.dv, off, parent.type, raw);
        }
      } else {
        writeNum(this.dv, base + field.offset, field.type, value);
      }
      this.touched.set(sec.id + ':' + row, true);
    }

    getByte(sec, row, off) { return this.u8[this.rowAddr(sec, row) + off]; }
    setByte(sec, row, off, v) { this.u8[this.rowAddr(sec, row) + off] = v & 0xFF; this.touched.set(sec.id + ':' + row, true); }

    /** byte-level diff of a row against the original file: [{off, orig, now}] */
    rowDiff(sec, row) {
      const a = this.rowAddr(sec, row), out = [];
      for (let i = 0; i < sec.entrySize; i++) if (this.u8[a + i] !== this.orig[a + i]) out.push({ off: i, orig: this.orig[a + i], now: this.u8[a + i] });
      return out;
    }
    revertRow(sec, row) { const a = this.rowAddr(sec, row); for (let i = 0; i < sec.entrySize; i++) this.u8[a + i] = this.orig[a + i]; this.touched.delete(sec.id + ':' + row); }

    /** all changes as runs: [{sec,row,off,bytes:[...],orig:[...]}] */
    changes() {
      const out = [];
      for (const key of this.touched.keys()) {
        const [s, r] = key.split(':').map(Number);
        const sec = this.sections.find(x => x.id === s); if (!sec) continue;
        const d = this.rowDiff(sec, r);
        if (!d.length) { this.touched.delete(key); continue; }
        let run = null;
        for (const b of d) {
          if (run && b.off === run.off + run.bytes.length) { run.bytes.push(b.now); run.orig.push(b.orig); }
          else { run = { sec: s, row: r, off: b.off, bytes: [b.now], orig: [b.orig] }; out.push(run); }
        }
      }
      return out.sort((a, b) => a.sec - b.sec || a.row - b.row || a.off - b.off);
    }

    applyChanges(list) {
      let n = 0;
      for (const c of list) {
        const sec = this.sections.find(x => x.id === c.sec); if (!sec || c.row >= sec.count) continue;
        for (let i = 0; i < c.bytes.length; i++) this.setByte(sec, c.row, c.off + i, c.bytes[i]);
        n++;
      }
      return n;
    }
  }

  /** Lua Loader patch: applies the byte runs to the live battlepack at startup. */
  function luaPatch(changes, meta) {
    const lines = [];
    lines.push('-- BattlepackPatch.lua  -  generated by Battlepack Workbench' + (meta && meta.file ? ' from ' + meta.file : ''));
    lines.push('-- Drop into x64/scripts/. Applies ' + changes.length + ' byte run(s) to the live battlepack (FF12 Lua Loader).');
    lines.push('local BATTLEPACK_PTR = 0x0208E680  -- qword -> battlepack file base (Steam 1.0.4.0)');
    lines.push('local patches = {');
    for (const c of changes) lines.push(`  { sec = ${c.sec}, row = ${c.row}, off = 0x${c.off.toString(16).toUpperCase()}, bytes = { ${c.bytes.join(', ')} } },  -- was { ${c.orig.join(', ')} }`);
    lines.push('}');
    lines.push(`
local function apply()
  local file = memory.readU64(BATTLEPACK_PTR)
  if not file or file == 0 then return false end
  local n = 0
  for _, p in ipairs(patches) do
    local base = memory.readU32(file + p.sec * 4 + 4)
    if base and base ~= 0 then
      local list, size
      if p.sec == 0 then
        size = memory.readU16(base); list = base + 4
      else
        size = memory.readU16(base + 8); list = memory.readU32(base + 0xC)
      end
      if list and size and size > 0 then
        memory.writeArray(list + p.row * size + p.off, p.bytes)
        n = n + 1
      end
    end
  end
  print(("BattlepackPatch: applied %d/%d patches"):format(n, #patches))
  return n == #patches
end

event.registerEventAsync("onInitDone", function() apply() end)
event.registerEventAsync("onSaveLoad", function() event.executeAfterMs(500, apply) end)
`);
    return lines.join('\n');
  }

  /* ---- minimal store-only ZIP writer (artifact saves allow .zip, not .bin/.lua) ---- */
  const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zipStore(entries) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    const now = new Date();
    const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
    const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
    for (const e of entries) {
      const name = enc.encode(e.name);
      const data = e.data instanceof Uint8Array ? e.data : enc.encode(e.data);
      const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);

60":"","13061":"","13062":"Slightly raises max HP.","13063":"Move with great celerity."},"MenuLootList":{"14000":"A stone allowing instantaneous transport between two gate crystals.","14001":"","14002":"{link=1}","14003":"{link=1}","14004":"{link=1}","14005":"{link=1}","14006":"{link=1}","14007":"{link=1}","14008":"{link=1}","14009":"{link=1}","14010":"{link=1}","14011":"{link=1}","14012":"{link=1}","14013":"{link=1}","14014":"{link=1}","14015":"{link=1}","14016":"{link=1}","14017":"{link=1}","14018":"{link=1}","14019":"{link=1}","14020":"{link=1}","14021":"{link=1}","14022":"{link=1}","14023":"{link=1}","14024":"{link=1}","14025":"{link=1}","14026":"{link=1}","14027":"{link=1}","14028":"{link=1}","14029":"{link=1}","14030":"{link=1}","14031":"{link=1}","14032":"A stone infused with the power of earth. It looks like an ordinary stone, but is surprisingly heavy.","14033":"A stone infused with the power of wind. It looks like an ordinary stone, but put it to your ear and you may hear thewind blowing.","14034":"A stone infused with the power of water. It looks like an ordinary stone, but gushes water when sundered.","14035":"A stone infused with the power of fire. It looks like an ordinary stone, but is faintly warm to the touch.","14036":"A stone infused with the power of ice. It looks like an ordinary stone, but is oddly cool to the touch.","14037":"A stone infused with the power of lightning. It looks like an ordinary stone, but tingles to the touch.","14038":"A stone infused with power most holy. It looks like an ordinary stone, but merely placing it in your hand gives you a feeling of tremendous peace.","14039":"A stone infused with a dark power. It looks like an ordinary stone, yet casts an eerily twisted shadow.","14040":"A stone infused with earth magicks. Many plant these in the soil to encourage a rich harvest.","14041":"A stone infused with wind magicks. Travelers carry these as charms to ensure safe passage with the wind at their backs.","14042":"A stone infused with water magicks. It is said one of these thrown into a brackish or foul pond will make it sweet as spring water.","14043":"A stone infused with fire magicks. Thrown into a flame, its power is said to multiply in the blink of an eye.","14044":"A stone infused with ice magicks. One of these placed in an icebox is enough to keep foodstuffs frozen for weeks.","14045":"A stone infused with lightning magicks. When shaken, these stones release an electrical charge sufficient to power a small airship.","14046":"A stone infused with holy magicks. Placed inside burial caskets to grant the dead peaceful repose, and the living peace of mind.","14047":"A stone infused with dark magicks. Placed in the proper locations, these protect a home from evil spirits.","14048":"A crystallization of potent earth magicks, said to contain the divine power of pure logic. The source of a gnoma entite's energy.","14049":"A crystallization of potent wind magicks, said to contain the divine power of protection. The source of a sylphi entite's energy.","14050":"A crystallization of potent water magicks, said to contain the divine power of regeneration. The source of an undin entite's energy.","14051":"A crystallization of potent fire magicks, said to contain the divine power of creation. The source of a salamand entite's energy.","14052":"A crystallization of potent ice magicks, said to contain the divine power of sorcery. The source of a leshach entite's energy.","14053":"A crystallization of potent lightning magicks, said to contain the divine power of destruction. The source of a mardu entite's energy.","14054":"A crystallization of potent holy magicks, said to contain the divine power of the sun. The source of a diakon entite's energy.","14055":"A crystallization of potent dark magicks, said to contain the divine power of the full moon. The source of a leamonde entite's energy.","14056":"{dialog 56 id=140056}A yellow gemstone bearing the name \"Aries.\" Represents the ideals that live in Man's heart.","14057":"A yellow gemstone bearing the name \"Taurus.\" Portends conspiracy and dark rumor.","14058":"A yellow gemstone bearing the name \"Gemini.\" Said to portend assassination.","14059":"A yellow gemstone bearing the name \"Cancer.\" Represents the forces of restoration and renewal.","14060":"A yellow gemstone bearing the name \"Leo.\" Represents wild dreams and unspoken ambitions.","14061":"A yellow gemstone bearing the name \"Virgo.\" Said to portend reincarnation.","14062":"A yellow gemstone bearing the name \"Libra.\" Represents success in negotiations.","14063":"A yellow gemstone bearing the name \"Scorpio.\" Foretells the fruition of long-held plans.","14064":"A yellow gemstone bearing the name \"Sagittarius.\" Represents the iron law of truth.","14065":"A yellow gemstone bearing the name \"Capricorn.\" Represents the forces of order and rule.","14066":"A yellow gemstone bearing the name \"Aquarius.\" Represents the forces of regeneration and regrowth.","14067":"A yellow gemstone bearing the name \"Pisces.\" Represents the tangled weave of fate.","14068":"Searing flames adorn this fiery jewel engraved with an exquisite depiction of a salamand entite.","14069":"Swirling thunderclouds adorn this cerulean jewel engraved with an exquisite depiction of a mardu entite.","14070":"Dancing chill winds cold enough to freeze time itself adorn this niveous jewel carved with an exquisite engraving of a leshach entite.","14071":"Renderings of cracked, broken earth adorn this umber jewel engraved with an exquisite depiction of a gnoma entite.","14072":"A great torrent, threatening to consume all, adorns this watery jewel engraved with an exquisite depiction of an undin entite.","14073":"A wind of terrible destructive power adorns this azure jewel engraved with an exquisite depiction of a sylphi entite.","14074":"Brilliant light shines from this alabast jewel engraved with an exquisite depiction of a diakon entite.","14075":"Eddies of jet-black darkness adorn this smoky jewel engraved with an exquisite depiction of a leamonde entite.","14076":"A jewel containing a creature's soul. Only when its soul is released will the creature find true peace.","14077":"A jewel containing the souls of many creatures. Within can be seen the true forms of creatures rent from their natural fates and bound within.","14078":"A tough shell. These are often used to craft crockery, armor, and other items of daily convenience.","14079":"A slightly worn shell. Considered antiques, the value of these pieces varies with the pattern of the cracks and pit-marks on the surface.","14080":"This shell is faded in color, but of remarkable durability and quality. These are prized by artificers for use in all manner of crafts.","14081":"A brittle skin molted as its former occupant outgrew its compass. Abundant and cheap, these are often ground into powders for various uses.","14082":"Artificers have perfected a technique of extracting and rarefying the mineral content of these hard, iron-rich husks.","14083":"A thick dragon-hide, like a sheath of iron. Countless are the blades that failed to pass its test and now lie sundered beneath the bleached bones of their owners.","14084":"A thick insect carapace, hard as gemsteel. Only those from the largest insects have any value, and the price varies with the piece's luster.","14085":"A carapace hewn from an aggressive, spiteful wyrm. Somewhat softer than a typical wyrm carapace, but exceedingly light. These are often used by armorers.","14086":"A set of equestrian armor meant only to be worn by a knight's steed. Valued more for its style than its substance.","14087":"This barding is the perfect balance of lightweight construction and protection. Its iron alloy composition makes it prone to rust if not properly maintained.","14088":"The oily surface of this scale gives off a peculiar sheen. Both the scale and its oil are known to find buyers at market.","14089":"Tiny pores in these scales allow them to breathe, preventing excessive moisture loss while still offering excellent protection against desert heat.","14090":"A scale from a fish as curious as it is fell. These are popular among those who favor their unusual patterning for use in crafts.","14091":"This impervious scale stands as proof of the mighty ring wyrm's existence. Few blades exist that can mark it, though many are the smiths who have tried to make one that can.","14092":"Unattractive, inexpensive wool, suitable only for stitching in places not like to be seen, lest it cheapen the garment's appearance.","14093":"Highly absorptive wool, widely used for fashioning garments for everyday wear.","14094":"This highly absorptive wool is quite soft, and well suited to use in bedding. Try a fine wool quilt once and the thought of anything else will give you nightmares.","14095":"This wool is of exceedingly high quality, and, as such, is the privilege only of nobles and landed gentry.","14096":"An easily torn, yet very pliable small pelt. These are suited to a variety of uses, but fetch a low price due to their ready availability.","14097":"A pliable skin that wears well. Garments made of snake skin last longer than those fashioned from inferior materials, though some dislike its eerie luster.","14098":"A tough hide, difficult to work with common tools. Sturdy armor can be made from strips of this material, though such armor is grindingly cumbersome.","14099":"A hide with just the right combination of pliability and strength. Its pleasing hue only improves with use, making it suitable for crafting quality articles.","14100":"A supple, majestic hide. As they are easily marred, only small sections are suitable for use, making them all the more valuable.","14101":"A basic material in the fashioning of leather goods. The tanning process makes these hides softer and far more useful than raw hides.","14102":"The tanned skin of a member of the race of giants. While of low quality, the feel of a giantskin garment cannot be matched. Neither, however, can the stench.","14103":"The tanned hide of a tyrant lizard. Highly elastic, but easily damaged by moisture.","14104":"A high-quality tanned hide, used in making clothing, bags, and all manner of useful goods.","14105":"This pelt is notable for its short, delicate hair that sheds heat and wears well in the sun. A popular clothing material in warmer climes.","14106":"A fine pelt with fur rising in a distinctive wave-like pattern. Its insulating qualities make it an excellent choice for cold- weather gear.","14107":"Soft fur covers the surface of this fine pelt. Clothing made from one of these is a luxury item coveted by nobles and adventurers alike.","14108":"A thick pelt, luxuriant in its softness and warmth. The sheen of its fur screams quality. One look is all it takes to steal the heart of any seamstress.","14109":"A feather small enough to fit in one's palm. The perfect accent to a hat, accessory, or other garment.","14110":"A large feather. Its value is judged not only by the beauty of its pattern, but also by its fullness and suitability as a decorative material.","14111":"A feather the size of a butcher's knife. These are sturdier than they might appear, and suitable for use in armor, though they smell a mite foul.","14112":"A feather large enough to conceal a moogle. Quite sturdy, these are used to reinforce all manner of tools and garments. Surprisingly heavy.","14113":"Several feathers tied into a single bunch. These are used for clothing, though the technique for fixing them to fabric requires patience and no little skill.","14114":"This feather, resembling a finely honed blade, makes a slicing sound when swung through the air. Grown seeq have been known to weep at its suppleness.","14115":"A spiral horn. While the material of the horn is hard, its hollowness makes it prone to shattering. As such, these horns have lost favor among artificers of late.","14116":"A sharply pointed horn which is completely hollow, save for its tip. Often only the top few fingers are used for crafting.","14117":"A solid core makes this horn highly prized for crafting. The larger the horn, the greater the price it fetches, though the heaviest can be hard to carry home.","14118":"This fang's sharp tip is perfect for rending flesh and sucking blood. Small serrations down the side of the tooth complete the carnage.","14119":"This claw-like fang is designed for biting and ripping, though it lacks penetrating force.","14120":"A large, spiral fang, possessing considerable penetrating force\u2014enough to pierce rock and even the hardest ore.","14121":"A cruel fang, worthy of the mighty maw within which it once stood. These evolved not only to deliver crushing bites, but also to withstand the wyvern's deadly breath.","14122":"These dense desert fruits are slightly sweet and surprisingly juicy. Valued as a treat for children.","14123":"These fruits are rather bitter when raw, but, when properly cooked, they become a delectable, mouth-wateringly sweet treat.","14124":"As their name suggests, these roots give off a horrible, ear-piercing scream when yanked from their earthy beds, giving unwary foragers the fright of their lives.","14125":"A thin, highly elastic vine. Easily cut, these are excellent for various crafts. Bundles of such vines are a common sight at market.","14126":"This poisonous, rotten-smelling fruit is valued as a source of virulent toxin. If cooked for a very long time, they can be rendered harmless enough to eat, but why bother?","14127":"This beautiful yellow flower takes weeks to bloom, lasts a mere day, and wilts before the next dawn. Its cloying scent is chokingly sweet.","14128":"This fragment is too small to identify the type of bone it once formed a part of. Some lands prohibit their use outright, others require prior ablution with holy water.","14129":"A solid, well-preserved bone. Its natural strength makes it perfect for numerous applications, though a purification ceremony is often required.","14130":"Belonging to one who lived a life steeped in others' blood, this bone is stained black with magicks and beyond purification. Used in magicks and alchemy.","14131":"Wood popular with shipwrights, carpenters, and builders.","14132":"Long years in the primordial forests have infused the fibers of this lumber with Mist. Perfect for use in the crafting of fine furnishings and magick staves.","14133":"A rough-hewn block of ore-veined stone. A ready supply of these stones has led to recent advancements in masonry... and some sturdy buildings.","14134":"These stones are chosen for their coloration as well as their usefulness as building materials. Used in the construction of prominent buildings and temples.","14135":"Discarded scraps of varying shapes and sizes. Great quantities are melted for reuse, but a large amount of impurities makes for low-quality metal.","14136":"A chunk of iron-rich ore. The iron is extracted and purified, though some lands forbid its use in the making of arms and ammunition for warfare.","14137":"A thick, virescent, sludgy goop that exudes a truly vile odor.","14138":"An ever-frothing, sulphureous liquid corrosive enough to melt metal into a plume of oily smoke. Exposure to air causes its distinctive coloration to fade.","14139":"A metallic liquid that turns to poison upon contact with any metal other than iron. Stored carefully in special wrought iron containers.","14140":"A foggy, dull glass bead. It is said that when a soul leaves its mortal frame, its former burdens remain in this world as the crystallized tears of clouds.","14141":"A translucent bead, thought to be the product of heavenly power. When a soul reaches heaven, it is said that the body left behind is transformed into one of these jewels.","14142":"A foul, fiendish being's eyeball, reeking of dark magicks. It seems to be watching, searching you for a weakness born of some small misdeed.","14143":"A deeply magicked feather, torn from the wing of something genuinely horrible. The feather's magicks aid the finding of air currents for flight.","14144":"The magicked tail of a demon. It is said that the only true gauge of a demon's temper is its tail, so practiced are they at hiding their evil natures.","14145":"A musty tome containing the words of a long-forgotten incantation in a language long dead. The diagrams suggest a magick capable of destroying Ivalice.","14146":"A musty tome containing the words of a long-forgotten incantation in a language long dead. The diagrams suggest a magick capable of ending life.","14147":"The remains of a blasted-out bomb. They are still quite volatile and must be handled with care. Some lands require a license for their handling.","14148":"The remains of a detonated bomb. Still contains fragments of unexploded material. Wiser folks leave these well alone.","14149":"A time-worn book of tales. The book is popular for the tragic fates that befall all of its characters.","14150":"A time-worn book of tales. This book tells the story of a commoner who became a knight. Every child loves the part where the hero single-handedly defeats a great army.","14151":"A time-worn book of tales. This book charts the course of history, following the births and deaths of hundreds, and the ripples their lives cause throughout the world.","14152":"Carrion flesh of the kind often eaten by hyenas and their ilk. Used in magicks and alchemy.","14153":"It is difficult to tell what part of what animal is represented by this oozing lump of meat. Used in dark magicks and alchemy.","14154":"This lurid, decaying lump is assumed to be maggoty. No one has been able to look at it long enough to know for sure. Used in dark magicks and alchemy.","14155":"Any creature of this world foolish enough to consume this flesh is assured an eternity of agonizing pain. Used mainly in high sorcery.","14156":"This chunk of stone, filled with the power of nature, gives off a wan light. These stones lend form to elementals and entites.","14157":"A common, featureless stone with a pleasing color and shape; the kind treasured by small children.","14158":"A sword with a jagged break halfway down the blade. One can only imagine with what grisly fate its former owner must have met.","14159":"The haft of this greataxe is broken, and the blade notched. The quantity of dried gore on the shaft suggests that its bearer met with a most unfortunate end.","14160":"A broken-hafted spear, thrust deep into the ground. Perhaps it marked the grave of its former wielder.","14161":"A staff bent beyond all usefulness. It is like that its former bearer's life ended in violence that left him as bent and useless as his favorite weapon.","14162":"A large metal disc, out of which the shape of a full moon has been carved. Rumored to be a device for the entrapment of spirits, or perhaps a protective charm.","14163":"A bundle of 1,000 needles. Frustrated merchants and impatient buyers arguing over the precise count of needles in a given bundle is a common market sight.","14164":"Something about this whip-like whisker speaks of intelligence beyond animal cunning. Used in magicks, and also a popular collector's item.","14165":"This handy tool, called a gavel by some artificers, is said to have once been used to restore order in courtrooms in ancient times.","14166":"This tattered and torn garment bears a chilling number of bloody puncture marks. Prayers for its former owner's well-being would doubtless be wasted.","14167":"This armor was sundered and broken in combat. Whoever wore it was surely brave, and is now just as surely dead.","14168":"This head was chopped off a chimera. Chimera heads are prized as an ingredient in alchemy, and only rarely appear on the open market.","14169":"A common alchemical ingredient. Rumored to be quite tasty when properly prepared.","14170":"A leather harness used on slaven. Blood and tufts of fur stuck to the harness attest to the heavy loads the slaven must bear.","14171":"A necklace stained black with spattered blood. The dull light it exudes suggests that it was once a piece of surpassing beauty.","14172":"This steel mane covering tapers to a sharp point, designed to impale unwary foes with a fatal lunge. Even those who shun war use these in the casting of magicks.","14173":"A strikingly simple but skillfully crafted accessory. Several of these bands may be linked together to form a chain.","14174":"A coalescence of goodwill found buried deep inside a corrupt and evil heart. It glistens like an uncut gemstone.","14175":"Sign by which one knows the true king of the beasts. Towering toward the heavens, the horn seems to challenge the gods themselves.","14176":"This fang is riddled with holes so small they cannot be seen by the naked eye, connecting to vein-like tubes running up the fang that pulse red when drawing blood.","14177":"These fangs are thought to ward off evil spirits. Some hang them in doorways to keep misfortune from visiting a household.","14178":"The perfectly preserved head of a skeleton, blessed and burned to give the owner's spirit rest. The teeth are known to chatter in the deep watches of the night.","14179":"These battle-scarred bones belonged to a race of humanoids who warred in ancient times, though no one knows who they fought, or why.","14180":"Bone from a slain wyrm. The powerful magicks encircling the bone are visible to the naked eye. Used in alchemy.","14181":"This bone is as hard as iron. Struck against a metal object, it produces a pleasing tone.","14182":"Though it resembles thin glass, this scale is anything but fragile. It shines in the dimmest light, glowing brightly even on nights of the new moon.","14183":"Scale from a primordial wyrm that has lived for centuries. The mere sight of one of these scales strikes fear into the hearts of those upon whom the wyrms prey.","14184":"This type of silver is laced with strong magicks, making it resistant to fire and the ill will of foes. A common material in quality arms and armor.","14185":"The strongest material known to exist in nature. Mention of this metal in the oldest records of Ivalice attests to its long-established use.","14186":"A legendary metal said to bestow divine protection. The product of a lost age, none now live who know the manner of its manufacting.","14187":"This steel bears a unique pattern like the rings of a tree. It is sometimes said that victory in battle is determined by how many soldiers wear this matchless metal.","14188":"of the metal which lends protection.","14189":"This oddly organic metal seems to grow and change shape, though it hardens when tempered in the purest of holy waters.","14190":"This metal contains veins of pure cloudstone, giving it an almost weightless feel. Made into armor, it promises passage into paradise, be it in this life or the next.","14191":"This whitish, natural alloy of silver and gold is sometimes called \"aurargentium\" by alchemists.","14192":"These fins graced the back of one of the largest fish in the sea. Considered a delicacy in lands where seafood is an important part of the diet.","14193":"A fin designed to cut through seas of sand. Extremely tough, and must be finely chopped for cooking. Used as a \"secret ingredient\" in any number of dishes.","14194":"A steaming ring wyrm liver. A recipe exists to turn one of these into a potent cure-all.","14195":"Hawks' eyes are specially developed to spot prey from high in the air. Used as an aid to vision in folk medicine, though the effects are questionable.","14196":"An eye with the power to freeze prey in its tracks with fear. In antiquity it was said they could even turn flesh to stone, though that ability has since been lost.","14197":"A blessed nectar limned in numinous light. A drop on the tongue causes such exhilaration that all pain and suffering is forgotten.","14198":"A nasty-smelling froth culled from the maw of a malboro. Dipped in this, the freshest fruit goes rotten in moments. The cause of the malboro's bad breath.","14199":"A liquid so rank, few dare handle it. A single whiff has been known to render men unconscious, and wake the dead from their sleep.","14200":"A viscous sauce sweet enough to cause dizziness. Dilute with water before cooking.","14201":"A translucent, odorless oil. Becomes viscous and soupy when mixed with water. Valued as an ingredient in several medicines.","14202":"This liquid is lighter than air itself. Look at it from different angles and it changes hue from a scintillating crimson to a glowing azure.","14203":"Only demons know the recipe for concocting this heady brew. Many are the lords who have fallen victim to its lure, selling all they have for one more drop.","14204":"A powder so black it seems to suck in all light and life. Artists have been known to use it in compositions to effect deep, rich shadows.","14205":"The physical manifestation of a soul's lingering scent. Some bathe in this powder, believing the traces of soul within will draw off their ill fortunes.","14206":"Vital ingredient for making the secret elixir that causes zombification. Use on humes and their ilk is a crime due to its mentally debilitating effects.","14207":"A small, buzzing fly. Those who listen to the sound of their wings overlong are said to suffer bouts of disorientation and confusion.","14208":"A livid-hued fly that feeds on the corpses of men. They appear as if by magick wherever there is death, and leave nothing but bleached bones behind.","14209":"A bat wing covered in gorgeous white fur. Prized by collectors for its outstanding beauty.","14210":"A giant wing from a great wyrm. Shaped like a bow to catch the wind and support the wyrm's massive bulk--a design copied by the first airshipwrights.","14211":"The remains of a detonated bomb. Even now, the pieces smolder and glow.","14212":"The fresh blood of a wolf that died from starvation, called a throat wolf after the horrible gurgling noise it is said to make when it expires. A rare find.","14213":"A gelatinous sac-like clump of countless tiny frog eggs. Watch closely and, every now and then, you can spy their contents moving.","14214":"Great amphibians exude this oil from their warty skin. Widely used as an ingredient in salves and ointments.","14215":"A chewy, invigorating cut of steak, t-bone and all. Best eaten by holding the bone with two hands and gnawing at the meat with great, primitive enthusiasm.","14216":"A leafy vegetable favored by chocobos. The taste is slightly bitter, but quite palatable, even for humes. Thought to give chocobos a slight buzz.","14217":"Shining powder gleaned from brilliantly glowing wings. Gives off a sublime, uplifting scent when burned, which is said to keep evil at bay.","14218":"A cold wind swirls in endless circles inside this perfect sphere. Merely touching it with your bare hands sends a penetrating chill through your bones.","14219":"A slender cylinder with hollow ends, made of raging arctic winds. Gives off a constant chilling aura of magickal potency.","14220":"A strange object containing a sphere wrapped in thin metallic wire. Capable of holding an electrical charge indefinitely.","14221":"A long, stringy object made of a special kind of metal. Holds an electrical charge that can be released at will.","14222":"The height of this candle's flame varies with the bearer. As long as someone holds it, the flame will never go out, the bearer's life force made manifest.","14223":"A prayer board bearing the name of an ancient star written in strange glyphs. A divination tool and protective ward from the eastern kingdoms.","14224":"A thin wisp of smoke rises from the mouth of this golden lamp. Once used to entrap the souls of demons, bound into service upon their release.","14225":"A flame painful to look upon. Said to be a looking-glass into the inferno, where tortured souls can be seen writhing in ceaseless agony.","14226":"An incredibly thin blade, translucent as a moonbeam. So sharp, a man might be beheaded without knowing it until a gust of wind came to finish the task.","14227":"A fine dust that glitters like stars in the night sky. Some natural philosophers believe the dust to have actually blown down to us from the stars themselves.","14228":"Each grain of this dust looks like a tiny moon. Legend says that if you shape the dust into a large crescent, it will form a boat to carry you to the moon.","14229":"A large egg that scintillates with the colors of the rainbow as you walk around it. Used for decoration, cooking, and as a reagent in medicine-making.","14230":"A rare sprig of clover with four symmetrical leaves. They say that finding one of these brings good luck.","14231":"A conical protuberance that gyres and gimbles. Used for making holes in extremely hard objects and wabes. A favorite of children everywhere.","14232":"The onion: a humble bulb that, with the proper spices and seasonings, can change the world.","14233":"This pumpkin has been hollowed out and fashioned into a lantern. Said to be a symbol of sagacity and erudition, and is thus favored by young scholars.","14234":"Tomato stalks, when chewed, are said to produce drowsiness and listlessness. Adventurers and knife throwers be warned!","14235":"A brooch so exquisite, even demons are said to sigh at its beauty and come to steal it, after which another sigh can be heard: that of the brooch's former owner.","14236":"Badge awarded for felling the legendary weapon, the Omega Mark XII, the sign of a true hero of Ivalice.","14237":"All the souls of the world are contained in this single sphere. Small enough to fit in a hand, but its power extends beyond the limits of knowledge.","14238":"A gemstone bearing the name \"Serpentarius.\" Said to portend great destruction and undoing.","14239":"A metal alloy impervious to breakage or blemish. Knowledge of its working was passed down the ages by a guild of jewelers, and it remains their secret.","14240":"Montblanc made this badge to award those whose actions brought glory to the clan. A fine example of skilled moogle handiwork.","14241":"An ever-burning tongue of flame that consumes all it is fed. At night it grows dark and cold as ice.","14242":"A legendary pottery glaze, known only in the eastern kingdoms. Said to instantly and eternally fix the form of any creation to which it is applied.","14243":"Clay used for building gaols, said to imprison not only the flesh and blood, but the soul as well.","14244":"Badge awarded for slaying the most powerful creature of all time, the great Wyrmgod, Yiazmat. The mark of a true knight of Ivalice.","14245":"A badge said to be handed down from the great angler of legend, Lu Shang himself. The mark of a true fisherman of Ivalice.","14246":"{link=1}","14247":"{link=1}","14248":"{link=1}","14249":"{link=1}","14250":"{link=1}","14251":"{link=1}","14252":"{link=1}","14253":"{link=1}","14254":"{link=1}","14255":"{link=1}","14256":"An empty bottle found on the banks of the Nebra. The discarded refuse of a town further upstream.","14257":"A small fish found in the River Nebra. Edible, but not very tasty.","14258":"A small fish found in the River Nebra. Tastes best fried.","14259":"A small fish found in the River Nebra. Best eaten fresh and raw, right after catching. A delicacy popular in Rabanastre markets.","14260":"A tuft of hair from the pom-pom that sways to and fro atop a moogle's head. Tricolor balls made from many tufts are said to bring good luck.","14261":"{link=260}","14262":"{link=260}","14263":"{link=260}","14264":"{link=260}","14265":"Dew harvested from a rare flower found only in the vales and defiles of the Dalmasca Estersand. Has the property of drawing out venom from poisoned wounds.","14266":"Shell from a mollusk found in the River Nebra. Pulverized into a powder and taken as an alleviator of distress.","14267":"A traditional salve used by the peoples living in the valley of the River Nebra. Effective on cuts, burns, and even bruises.","14268":"The molted skin of the great serpent, the nidhogg. A single glance at its gargantuan span is enough to discourage most would-be hunters.","14269":"A local spirit made in the Skycity of Bhujerba. So strong, a single sip is enough to warm a man on even the coldest nights in the clouds.","14270":"{link=1}","14271":"{link=1}","14272":"{link=1}","14273":"{link=1}","14274":"An elegantly carved tablet inlaid with gold. It is a mark of status held by gentry in the Imperial City of Archades.","14275":"A simple, carved tablet inlaid with silver. It is a mark of status held by ardents in the Imperial City of Archades.","14276":"Package received from a bangaa merchant who wants it delivered to an associate at Eastgate.","14277":"A small stone in the shape of a drop of dew, formed when water touches the sal-tree of Eruyt Village. The stones come in a variety of colors.","14278":"Very rarely, when a certain creature is slain, the lost life force coalesces into a tiny black orb. Some magickal devices are said to draw on this energy.","14279":"A fragrant stick of jaya wood, said to protect the bearer from evil spirits.","14280":"{link=1}","14281":"{link=1}","14282":"{link=1}","14283":"{link=1}","14284":"{link=1}","14285":"{link=1}","14286":"{link=1}","14287":"{link=1}","14288":"{link=1}","14289":"{link=1}","14290":"{link=1}","14291":"{link=1}","14292":"{link=1}","14293":"{link=1}","14294":"{link=1}","14295":"{link=1}","14296":"{link=1}","14297":"{link=1}","14298":"{link=1}","14299":"{link=1}","14300":"{link=1}","14301":"{link=1}","14302":"{link=1}","14303":"{link=1}","14304":"{link=1}","14305":"{link=1}","14306":"{link=1}","14307":"{link=1}","14308":"{link=1}","14309":"{link=1}","14310":"{link=1}","14311":"{link=1}","14312":"{link=1}","14313":"{link=1}","14314":"{link=1}","14315":"{link=1}","14316":"{link=1}","14317":"{link=1}","14318":"{link=1}","14319":"{link=1}","14320":"{link=1}","14321":"{link=1}","14322":"{link=1}","14323":"{link=1}","14324":"{link=1}","14325":"{link=1}","14326":"{link=1}","14327":"{link=1}","14328":"{link=1}","14329":"{link=1}","14330":"{li .","20109":"","20110":"","20111":"","20112":"A writ given you by Tomaj granting its bearer right of passage through the east gate for the acquisition of foodstuffs.","20113":"A reference containing clan exploits, hunt log, bestiary, and adventuring tips.","20114":"Red flowers that grow only in Dalmasca. You found them after defeating the Rogue Tomato.","20115":"A rare flower that comes into bloom once every few years. Its petals have medicinal value, with those harvested from cacti turned cactoid said to be particularly potent.","20116":"A tube fuse pieced together from scavenged parts. It may not be much to look at, but it is well crafted.","20117":"A sword signifying a place among the Order of the Knights of Dalmasca. Dalan has tasked you with its delivery.","20118":"This key opens the bulkhead of a brig aboard Leviathan.","20119":"This key grants access to Leviathan's security system, which controls the ship's internal alarm.","20120":"A piece of magicite left by King Raithwall. It signifies descent from the Dynast-King.","20121":"A dark, fist-sized stone. When exposed to the energies of the sun, it becomes a type of magicite known as sunstone.","20122":"A piece of magicite made from shadestone that has been imbued with the power of the sun. Sunstone is commonly used as a source of heat and light.","20123":"A legendary cockatrice feather with a brilliant white sheen. Touching the feather, you feel a strange bond with the cockatrices...","20124":"A jade ring bearing the likeness of a toad. The ring holds special meaning to the villagers who call Giza Plains their home.","20125":"An urn given you by the villagers of Giza Plains. It is used to entrap the souls of beasts.","20126":"This key grants access to Site 3 of the Lhusu Mines.","20127":"This key grants access to Site 11 of the Lhusu Mines.","20128":"A stone cutting given you by Dalan. It is needed to reach the treasury in the Royal Palace. A lion is emblazoned on its face.","20129":"A medallion that opens a door within the Palace of Nabudis. Magick energies ebb and flow within.","20130":"{link=129}","20131":"{link=129}","20132":"A medallion that opens a door within the Palace of Nabudis. It is inert, its magicks long lost.","20133":"A piece of magicite said to open the way to a forbidden place. An inscription carved in the stone's back reads: \"He with power, trust it not.\"","20134":"A medicinal herb found on Ozmone Plain. It has long been used in the treatment of fevers.","20135":"The tail of a vorpal bunny, a legendary black dreamhare found in Golmore Jungle. It is a prized reagent.","20136":"A letter written by Ann, chief steward aboard one of the East Ivalice Company's airships. It is addressed to her six sisters, each of whom works a different airship route.","20137":"A special kind of magicite developed by the Archadian Empire. Unlike ordinary magicite, this absorbs magicks.","20138":"A scrap of metal that looks as though it may once have been part of a piece of armor. You found it lodged between the claws of the Lindwyrm.","20139":"The sword left by King Raithwall. It is capable of destroying nethicite.","20140":"The blade given Ashe by the Occuria. It has the power to cut new shards of nethicite.","20141":"A letter left in a deserted building in Lowtown. \"East South- east East Southwest Southeast\" is scrawled across the page.","20142":"A liquid base used in the fermentation of the finest serpentwyne. You obtained it after defeating the Marilith.","20143":"One of four pieces of a broken medallion. You obtained it beyond the sluice gates in the Garamsythe Waterway.","20144":"One of four pieces of a broken medallion. You received it as a reward for finding and returning Samal's stolen articles.","20145":"One of four pieces of a broken medallion. You obtained it with the help of Filo and Kytes.","20146":"A bundle of articles stolen by the contrite thief, only to be stolen once again by Orthros. Don't tease the...flan?","20147":"An oddly shaped key received from the leader of a band of thieves. The key opens a door into the Barheim Passage.","20148":"A fishing rod crafted by a master swordsmith. The rod is light, easily handled, and surpassingly strong.","20149":"A cursed fishing rod that drinks the lifeblood of the fish it hooks. You obtained it from Gilgamesh, ancient man of mystery.","20150":"A symbol of friendship conveyed upon trusted allies of the cactoids. They hold the bearers of such compacts in high honor.","20151":"A token given to cactoids who have distinguished themselves among the grove. The other races of Ivalice take little notice.","20152":"An armband worn by the staff at Clio's Technicks in Bhujerba. The store's name is neatly embroidered on its surface.","20153":"A diary kept by Pilika, a member of the staff at Clio's Technicks in Bhujerba. It chronicles her day-to-day affairs.","20154":"A ring worn by followers of the Light of Kiltia. The crest of Faram, the Father, is etched in its band.","20155":"A bundle dropped by a viera traveler as she fled a vyraal. The cloth is dyed with an intricate pattern of trees.","20156":"A beautiful necklace in the Galtean style. You found it in Nalbina and took it as your own.","20157":"","20158":"A Draklor Laboratory security card. It bears the seal of the Archadian Empire.","20159":"","20160":"","20161":"","20162":"","20163":"A medallion made of moonsilver, a very rare metal. These medallions are traditionally given to loved ones as a token of affection.","20164":"The message contained in the blue bottle. Pallid letters shimmer on the page: \"River...unde...o\"","20165":"The message contained in the green bottle. Emerald letters shimmer on the page: \"Forest...rgro...w\"","20166":"The message contained in the red bottle. Vermillion letters shimmer on the page: \"Fire...undb...h\"","20167":"The message contained in the yellow bottle. Gilt letters shimmer on the page: \"Ash...ridg...er\"","20168":"The message contained in the black bottle. Jet-black letters shimmer on the page: \"Darkness...eton...e\"","20169":"","20170":"","20171":"","20172":"A piece of magicite you found in the treasury of the Royal Palace of Rabanastre. It must be extremely valuable.","20173":"A gift prepared by the garif Great-chief in hopes of acquiring some Giza cockatrices. It is addressed to Brunoa, the nomad elder in the Giza Plains.","20174":"A broken, useless key. Sorbet had been meaning to get it fixed.","20175":"A key needed to operate the sluice gates. It used to be broken, but Sorbet had his brother repair it.","20176":"","20177":"A globe fashioned of silver rings decorated with arcane patterns.","20178":"A device for reading the winds. It is used to navigate through sandstorms on the open desert.","20179":"","20180":"A scale found on the corpse of a vyraal. Natural philosophers studying wyrms and their kin are known to pay well for such.","20181":"A key bartered in exchange for a dragon scale. It is said to open the way to the lair of a great wyrm.","20182":"A key to a door in the Sochen Cave Palace. Dire beasts are imprisoned within.","20183":"A charm made by the viera. It grants passage through the barriers of Golmore Jungle.","20184":"Proof that the bearer has hunted rare game. The hunters of the Phon Coast collect such trophies.","20185":"{link=184}","20186":"{link=184}","20187":"{link=184}","20188":"{link=184}","20189":"{link=184}","20190":"{link=184}","20191":"{link=184}","20192":"{link=184}","20193":"{link=184}","20194":"{link=184}","20195":"{link=184}","20196":"{link=184}","20197":"{link=184}","20198":"{link=184}","20199":"{link=184}","20200":"{link=184}","20201":"{link=184}","20202":"{link=184}","20203":"{link=184}","20204":"{link=184}","20205":"{link=184}","20206":"{link=184}","20207":"{link=184}","20208":"{link=184}","20209":"{link=184}","20210":"{link=184}","20211":"{link=184}","20212":"{link=184}","20213":"{link=184}","20214":"{link=184}","20215":"","20216":"","20217":"","20218":"","20219":"","20220":"","20221":"","20222":"","20223":"","20 consequences! Containing three (3) doses of eye drops, this set is sure to fit the bill.","22008":"Contains one (1) Capella, a marksman's rifle, and one (1) pouch of a special shot imbued with silencing magicks.","22009":"Spear tipped with a flattened blade. Designed chiefly for civil, rather than martial, purposes, its armor piercing capabilities have been left somewhat wanting.","22010":"An iron blade of common, even clumsy, design, it is nonetheless well regarded by many a warrior for its uncommon durability.","22011":"This set should serve well in a pinch! A generous supply of potions, handkerchiefs, and gold needles.","22012":"Contains one (1) quiver of arrows, each with an oil-soaked cloth wrapped about its point, and one (1) longbow.","22013":"Contains one (1) Vega, and one (1) pouch of water shot, which bear a striking semblance to tears. Every bit as useful against those fiery beasties as you'd hope!","22014":"One (1) pole, carved from a fine-grain wood highly prized in the eastern kingdoms. It has been reinforced in places with strips of metal for added strength.","22015":"One kiss not enough to stir you from your slumber? Perhaps a set of five (5) will do the trick! Now with matching tufts of phoenix down, at a price that will make rival retailers blush with envy!","22016":"The blade of this sword is said to drink the blood of foes, growing ever deeper in hue as it slakes its thirst. A dread blade.","22017":"Robe and cap ensemble for the traveler on the go. In the linings of each are sewn charms warding against misfortune.","22018":"This three (3) piece set includes an ornate breast plate, shield, and helm, seemingly wrought of pure gold.","22019":"Red cap and matching armor. The color softens and grows richer with wear.","22020":"Venture on neither hunt nor quest without this set of hi-potions and Nu Khai sand in your haversack!","22021":"Fierce flames dance the length of this blade, searing the flesh of its mark even as it cuts. A mighty weapon.","22022":"One swallow and you will know why they call them spirits. \"Lose yourself in the first sip, find yourself in the second.\"","22023":"Contains one (1) Loxley bow, and one (1) quiver of hollow- shaft arrows. The hollows of the arrows are fitted with sacs of poison.","22024":"Heavy pieces of armor polished to a mirror finish and suffused with strong magicks, affording additional protection beyond the physical.","22025":"Fangs of a great beast, ever burning. Within each is said to dwell a fire elemental.","22026":"Raiment and tiara of seductive beauty, lightly scented, as if with some sweet flower.","22027":"These pieces are said to wait for one whose heart burns with a worthy flame. They have seen service in battle, and surely smell the part.","22028":"Contains one (1) crossbow and one (1) quiver of bolts, cut long. A favorite weapon of the ranger.","22029":"Simple pole made of iron. Its end is stained with dried blood.","22030":"Travelers, be prepared! Contains both hi-potions and tufts of phoenix down, so you can venture out with confidence.","22031":"Engravings of water elementals adorn these shards of magicite. The magicks within are quite strong.","22032":"Both pieces of this classic ninja outfit are entirely black, loose-fitting, and made of a unique material that aids movement.","22033":"Helm and armor fashioned after a chelonian shell. The pieces breathe well, making them ideal for wear in tropical climes.","22034":"Contains one (1) recurve crossbow and one (1) quiver of needle-thin bolts. The light materials used in the weapon's construction make it a hunter's favorite.","22035":"With a serrated blade, this is a most unusual ninja sword. It is thought that this choice of design may have been made with the intent of further opening any wounds inflicted.","22036":"It's difficult to prepare for every eventuality you may encounter in your travels, but this set is a good start. A healthy supply of antidotes, eye drops, and echo herbs!","22037":"By popular demand, we've assembled no fewer than twenty- five (25) tufts of phoenix down. Don't let yourself be caught down for the count!","22038":"Used to perform certain sacred rites in the eastern kingdoms. The wearers of these garments are said to experience a great surge of strength.","22039":"Made using only the finest materials, this set of platinum armor gleams handsomely in the light.","22040":"Contains one (1) incendiary device and one (1) pouch of poison-spewing bombs. Poison volume regulated by mandate.","22041":"In antiquity this small axe was primarily used as a throwing weapon.","22042":"So strong is the substance of this blade, the warp in its edge could not be mended. Sold as is.","22043":"An unusual three-pronged spear, much resembling a common fork.","22044":"Contains one (1) firearm and one (1) pouch of shot, made from hardened mud. The intent, of course, being to cover one's foes in mud, rendering them blind. And muddy.","22045":"Contains one (1) incendiary device, the Tumulus, and one (1) pouch of bombs. The bombs contain a fortified blasting glycerin, and are themselves wrapped in combustible cloth.","22046":"These bolts are actually tightly rolled scrolls, a spell of dark magicks inscribed on the vellum. Quite valuable. With included crossbow, it makes for a great bargain.","22047":"Contains serums and Nu Khai sand, in good quantity, at a price not to be passed by!","22048":"A must for any potion connoisseur! Contains several of each variety. Consider your restorative needs when deciding which to drink. And please, drink responsibly.","22049":"Not just for show, these pieces are, as any warrior worth his codpiece will attest, highly prized on the battlefield.","22050":"Contains one (1) Spica war gun, and one (1) pouch of shot, sometimes known as \"wind shot,\" that gathers air behind it in a cone as it flies for an impact that can pierce rock.","22051":"Contains one (1) quiver of arrows, made of packed permafrost, and one (1) bow of surpassing quality, said to have been carried by a great hero of antiquity.","22052":"Contains one (1) incendiary device and one (1) pouch of bombs. Rumored to be used by the Archadian elite guard to sew chaos among enemy ranks; a tactic of brutal efficiency.","22053":"Rings adorn the tip of this staff. They say that by peering through the rings one may catch a glimpse of a greater truth.","22054":"A walking staff of the sort you might expect a dignitary or high-ranking official to carry. Excellent craftsmanship.","22055":"Restocked and better than ever! You are not like to find a lower price on tufts of phoenix down, perennial favorite of adventurers far and wide!","22056":"Protectives preferred by practitioners of the black magick arts.","22057":"Protectives preferred by practitioners of the white magick arts.","22058":"Clothing and crown made of twig and leaf. Steel's cold embrace is as nothing before the splendor of nature's bounty.","22059":"A shield fearsome to look upon. The mouth at its center is a portal to the unknown, a great maw that opens wide to drink in the Dark.","22060":"Armor of the highest quality, crafted by masters of their art, its materials and design carefully selected to provide surpassing resilience.","22061":"Heavy armor though it be, this helm is strongly magicked. A worthy choice for those knights who rely upon more than just the steel of their blades.","22062":"Contains one (1) quiver of enchanted bolts, and one (1) crossbow. Scouts of great skill are known to favor such as these.","22063":"Palm-sized orbs containing a magicked water.","22064":"Fashioned after a legendary blade made from the tail of a dragon. Called the Great Scythe in the eastern kingdoms, it is said to have reaped entire fields in a single swing.","22065":"Dagger with two blades that cross as they taper to a point.","22066":"A demon has been carved into the body of this sword. The frozen leer of its jaw forms a cruel, cutting blade.","22067":"Long and narrow, this greatsword is adorned with a crest marking its bearer as a knight.","22068":"The world to a child. The weight of the world to an old man.","22069":"Incendiary device of destructive force beyond measure. A fell spirit is rumored to dwell deep within.","22070":"A cruel blade forged for battle, its very shape a violence.","22071":"Filled with the grace of the moon goddess, the shaft emits a numinous glow.","22072":"This sword's blade resembles an ophidian tongue, ornately wrought.","22073":"Replica of a great sword of legend. It lacks the vivid coloring of the original, but is elsewise its match.","22074":"You might be inclined to pussyfoot about in this magicked hood. For the stylish adventure who knows it all, this accessory will surely pay for itself!","22075":"Contains one (1) pouch of stone shot. This shot could easily pass for some sort of petrified egg.","22076":"Hammer made in imitation of a giant scorpion tail. Capable of inflicting devastating damage.","22077":"Crafted of a beautiful silver metal and adorned with thorns of deep magenta. The handle is affixed with a small shield.","22078":"The finest bolts money can buy. Loosed, they resemble the javelins of the heroes of antiquity, hurtling straight and true toward their mark.","22079":"Heirloom of a royal line whose progeny have long since faded into obscurity. All others who don the necklace are said to meet with betrayal.","22080":"Spear-like in appearance, this pole takes its name from what many consider the greatest beast to dwell in the deeps.","22081":"Late-model, long bore hunting rifle. Wide body, narrow muzzle.","22082":"A layered-disc pattern runs the length of this magnificent blade. Its power is legendary, a single blow laying low all but the most resolute adversary.","22083":"Filled with the grace of the moon goddess, the body emits a numinous glow.","22084":"form. Various metals make up the elaborate decoration adorning its face.","22085":"The spearhead bears an ancient magicked seal, the words \"Consigned to the Flame\" etched therein. Only those of utmost proficiency with the spear may wield it.","22086":"Exquisite battle axe that shines golden in the light. He who would wield it must be well skilled to accord such craftsmanship.","22087":"Sages are said to have taken draughts of this liquid to replenish lost arcane energies.","22088":"High sages are said to have taken draughts of this liquid to replenish lost arcane energies.","22089":"Legendary draught mixed from waters divine, said to mend all wounds great and small. Every adventurer should keep one close to hand.","22090":"Divine draught oft appearing in tales of legend, said to mend all wounds great and small. Every adventurer should keep one close to hand.","22091":"A crystal, filled to overflowing with occult magicks. Sublime light radiates from within.","22092":"The surface of this gem writhes with a serpentine pattern. Within, untold magicks sleep.","22093":"An otherworldly light emanates from within this jewel. A profound sense of peace comes over all who look upon it.","22094":"Alloy of unsurpassed hardness. Cannot be worked with ordinary tools.","22095":"A red zigzag pattern runs the length of the blade, weaving its way across delicate inlay.","22096":"A single, beautiful sunflower. Brilliant as the sun, wondrous as creation.","22097":"A replica of a legendary blade said to have slain a fell wyrm that long ago preyed upon the eastern kingdoms. With a sword such as this, one might write new legends!","22098":"Mysterious substance that feeds on night's darkness. Beneath its surface lurk foreboding magicks.","22099":"Text dating from antiquity, prescribing tactics and guidance to those who would walk a given path.","22100":"{link=99}","22101":"{link=99}","22102":"{link=99}","22103":"Shard of magicite engraved with a seraph. Strong magicks pulse from within.","22104":"Shard of magicite engraved with a winged serpent. Strong magicks pulse from within.","22105":"Contains two (2) potions. Sure to be of use on your travels!","22106":"Contains ten (10) hi-potions. Neither hunter nor adventurer should ever go without!","22107":"Time waits for no man, why should you wait for time? Contains ten (10) chronos tears.","22108":"Contains ten (10) tufts of phoenix down. A tried and trusted staple, at home in the haversack of any adventurer.","22109":"Leaving for foreign climes? Disease can strike at any time... Best be prepared! Contains ten (10) serums.","22110":"Momentous battle on the horizon? Best be sure of your potion supply before charging in. Contains ten (10) x-potions.","22111":"The clasp of this necklace is fashioned from tortoiseshell. For those with discriminating taste.","22112":"Originally made to quieten the footfalls of those who serve by being seen and not heard, these shoes soon found a place among those who serve by being neither seen nor heard.","22113":"Decorative trinket conceived long ago by a pugilist seeking a means to harness his inner strength.","22114":"This small ornament glows softly when worn, emitting a feeble light.","22115":"Footgear worn by those preparing for their eternal rest. Redolent of death.","22116":"When fighting on the floors of coliseums, gladiators were made to wear harnesses such as this to prevent their escape.","22117":"These large gloves narrow at the wrist, trapping heat inside.","22118":"Ornamental belt made by the stringing of chain links one to another. A badge of great strength among those who test their mettle on the field of battle.","22119":"Intricate magick glyphs adorn the lining of these boots, conveying arcane powers to their wearer.","22120":"Fashioned in the likeness of a pheasant, this is a tremendously popular item.","22121":"Made of gold, this amulet imparts a sense of both dignity and wisdom.","22122":"A large opal is set at the center of this bejeweled ring.","22123":"Small wings adorn this pair of boots.","22124":"{link=99}","22125":"{link=99}","22126":"{link=99}","22127":"It has been said this urn was made to lock away living
